name: Deploy production to AWS

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rapl-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy static site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Verify build output
        run: test -d dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1
          allowed-account-ids: "093243707890"
      - name: Deploy non-hashed files to S3
        run: |
          aws s3 sync dist/ s3://raplleadership-site-prod/ \
            --delete \
            --exclude "_astro/*" \
            --cache-control "public,max-age=0,must-revalidate"

      - name: Deploy hashed Astro assets to S3
        run: |
          if [ -d dist/_astro ]; then
            aws s3 sync dist/_astro/ s3://raplleadership-site-prod/_astro/ \
              --delete \
              --cache-control "public,max-age=31536000,immutable"
          fi

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id EEJTV6CE3BYTS --paths "/*"
